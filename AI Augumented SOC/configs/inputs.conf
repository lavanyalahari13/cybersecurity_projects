# Splunk Universal Forwarder — inputs.conf
# Place at: /opt/splunkforwarder/etc/system/local/inputs.conf

[monitor:///var/log/auth.log]
disabled = false
index = main
sourcetype = syslog

[monitor:///var/log/syslog]
disabled = false
index = main
sourcetype = syslog

[monitor:///var/log/journal-export.log]
disabled = false
index = main
sourcetype = syslog
